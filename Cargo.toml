[package]
name = "numera-image-gen-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Provider-independent native image orchestration MCP server"
repository = "https://github.com/KiaroSama/Numera-Image-Gen-MCP"
publish = false

[lib]
path = "native/lib.rs"

[[bin]]
name = "numera-image-gen-mcp"
path = "native/main.rs"

[[bin]]
name = "numera-dev"
path = "native/devtools/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "server", "transport-streamable-http-server"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
subtle = "=2.6.1"
ring = "=0.17.14"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
icu_collator = "=2.3.1"
icu_locale = "=2.3.1"
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "multipart", "gzip", "brotli", "deflate"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "io-std", "process", "fs", "signal"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
percent-encoding = "=2.3.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ryu-js = "=1.0.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "unbounded_depth", "raw_value"] }
sha2 = "=0.11.0"
thiserror = "=2.0.21"
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }

