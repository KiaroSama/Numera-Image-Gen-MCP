name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NUMERA_TEST_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run format:check
        id: formatting
      - name: Show formatting corrections without weakening the check
        if: failure() && steps.formatting.conclusion == 'failure'
        shell: bash
        run: |
          node -e 'console.error(JSON.stringify({timestamp:new Date().toISOString(),level:"WARNING",component:"ci-format",message:"Formatting failed; printing corrections without accepting them."}))'
          npm run format
          git diff --no-ext-diff
      - run: npm run coverage
      - run: npm run smoke
      - run: npm run package:check
      - run: npm audit --omit=dev
